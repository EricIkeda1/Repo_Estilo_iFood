name: Flutter
on: [push, workflow_dispatch]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings lib
      - run: flutter build web
      - run: node --check cloud/index.mjs
      - run: curl --fail --retry 2 https://br-damp-flower-bd9dyeuv-delivery.compute.c-8.us-east-2.aws.neon.tech/health
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
      - run: flutter create --platforms=android --project-name=eyi_food --org br.com.ericyikeda .
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: eyi-food-android
          path: build/app/outputs/flutter-apk/app-debug.apk
